name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  macos:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (macOS)
        run: swift build

      - name: Test (macOS, pure logic)
        run: swift test

      - name: Test (iOS Simulator)
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -scheme DevLens-Package \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -quiet
